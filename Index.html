<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJA</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f5f7fb;--card:#fff;--line:#dfe4ec;--text:#172033;--muted:#718096;
  --blue:#315efb;--blue2:#2448cf;--danger:#e34b4b;--shadow:0 8px 25px rgba(20,35,70,.07)
}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1200px;margin:auto;min-height:100vh;background:var(--bg)}
.topbar{
  height:92px;background:var(--card);border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:90px 1fr 90px;align-items:center;padding:0 18px;
  position:sticky;top:0;z-index:20
}
.logo-profile{
  width:64px;height:64px;border:2px solid #202b44;border-radius:18px;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;
  font-size:32px;line-height:25px;overflow:hidden
}
.logo-profile img{width:100%;height:100%;object-fit:cover}
.logo-profile small{font-size:10px;font-weight:700}
.brand{text-align:center;font-size:30px;font-weight:800;letter-spacing:4px}
.notify{justify-self:end;width:52px;height:52px;border:0;border-radius:50%;background:#fff;font-size:27px;position:relative}
.notify .dot{display:none;position:absolute;right:6px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--danger);border:2px solid #fff}
.navrow{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-bottom:1px solid var(--line)}
.navbtn{height:58px;border:0;background:#fff;font-weight:800;font-size:18px;color:#596579;border-bottom:3px solid transparent}
.navbtn.active{color:#172033;border-bottom-color:#172033}
.main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.8fr);min-height:calc(100vh - 150px)}
.feed{padding:16px;border-right:1px solid var(--line)}
.chat-panel{background:#fff;padding:14px;position:relative}
.section-title{font-size:18px;font-weight:800;margin:3px 0 12px}
.post{
  background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;
  overflow:hidden;box-shadow:var(--shadow)
}
.post-head{display:flex;align-items:center;gap:10px;padding:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:#172033;color:#fff;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.user-info{flex:1}.user-info b{display:block}.user-info span{font-size:12px;color:var(--muted)}
.more{border:0;background:none;font-size:23px}
.post-body{padding:0 13px 12px;white-space:pre-wrap;line-height:1.5}
.post-image{width:100%;max-height:440px;object-fit:cover;display:none;background:#e9edf5}
.post-meta{display:flex;gap:16px;padding:8px 13px;color:var(--muted);font-size:13px;border-top:1px solid #eef1f5}
.actions{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.actions button{height:43px;border:0;background:#fff;color:#667085;font-weight:700}
.actions button:hover{background:#f5f7fb}.actions button.liked{color:var(--danger)}
.composer{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px;
  box-shadow:var(--shadow)
}
.composer textarea{width:100%;min-height:80px;border:0;outline:0;resize:vertical;font-size:15px}
.compose-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eef1f5;padding-top:9px}
.file-label{cursor:pointer;font-weight:700;color:#536173}.file-label input{display:none}
.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:9px 17px;font-weight:800}
.primary:hover{background:var(--blue2)}
.primary:disabled{opacity:.5;cursor:not-allowed}
.chat-head{font-weight:800;font-size:18px;padding:4px 3px 12px}
.chat-item{
  display:flex;align-items:center;gap:10px;padding:11px 5px;border-bottom:1px solid #eef1f5;
  cursor:pointer;border-radius:9px
}
.chat-item:hover{background:#f6f8fc}
.chat-item .avatar{width:40px;height:40px}
.chat-text{flex:1;min-width:0}.chat-text b{display:block}.chat-text span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.settings{
  position:fixed;right:calc((100vw - min(1200px,100vw))/2 + 15px);bottom:15px;
  border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:800;
  box-shadow:var(--shadow);z-index:30
}
.overlay{display:none;position:fixed;inset:0;background:rgba(10,18,35,.45);z-index:50;align-items:center;justify-content:center;padding:16px}
.modal{width:min(500px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{margin-top:0}.close{float:right;border:0;background:#eef1f5;border-radius:50%;width:35px;height:35px}
.chat-window{width:min(560px,100%);height:min(680px,90vh);display:flex;flex-direction:column}
.messages{flex:1;overflow:auto;background:#f5f7fb;padding:15px}
.msg{max-width:78%;padding:9px 12px;border-radius:13px;margin:7px 0;line-height:1.4}
.msg.me{margin-left:auto;background:var(--blue);color:#fff;border-bottom-right-radius:3px}
.msg.other{background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}
.chat-input{display:flex;gap:8px;padding-top:10px}
.chat-input input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px;outline:0}
.comment-box{display:none;padding:10px;border-top:1px solid var(--line)}
.comment-box input{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;outline:0}
.comment-list{padding:0 10px;max-height:160px;overflow:auto}
.comment-list .c{font-size:13.5px;padding:6px 0;border-bottom:1px solid #f2f4f8}
.comment-list .c b{margin-right:5px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.switch{width:48px;height:27px;border:0;border-radius:20px;background:#ccd3df;position:relative}
.switch:after{content:"";position:absolute;width:21px;height:21px;top:3px;left:4px;background:#fff;border-radius:50%;transition:.2s}
.switch.on{background:var(--blue)}.switch.on:after{left:23px}
.loading-screen{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;letter-spacing:2px;z-index:999;color:#172033}
@media(max-width:760px){
  .topbar{height:78px;grid-template-columns:70px 1fr 65px;padding:0 10px}
  .logo-profile{width:54px;height:54px;font-size:28px}.brand{font-size:23px}
  .main{display:block}.feed{border-right:0;padding:10px}.chat-panel{display:none}
  .settings{right:12px;bottom:12px}.navbtn{height:52px;font-size:16px}
}
body.dark{--bg:#0e1420;--card:#151d2b;--line:#2a3446;--text:#f2f5fa}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">MAJA</div>

<div class="app" id="appRoot" style="display:none">
  <header class="topbar">
    <button class="logo-profile" onclick="openProfile()" aria-label="Profile"><span id="topAvatar">M</span></button>
    <div class="brand">MAJA</div>
    <button class="notify" onclick="showNotifications()" aria-label="Notifications">♧<span class="dot" id="notifyDot"></span></button>
  </header>

  <nav class="navrow">
    <button class="navbtn active" id="threadBtn" onclick="showTab('thread')">THREAD</button>
    <button class="navbtn" id="chartBtn" onclick="showTab('chart')">CHART</button>
  </nav>

  <main class="main">
    <section class="feed" id="threadView">
      <div class="composer">
        <textarea id="postText" placeholder="Hello Maja users, type something..."></textarea>
        <div class="compose-row">
          <label class="file-label">📷 Picture
            <input id="postImage" type="file" accept="image/*" onchange="previewImage(event)">
          </label>
          <button class="primary" id="postBtn" onclick="createPost()">POST</button>
        </div>
        <img id="preview" class="post-image" alt="Preview">
      </div>
      <div class="section-title">THREAD</div>
      <div id="posts"><div class="empty">Loading posts...</div></div>
    </section>

    <aside class="chat-panel" id="chartView">
      <div class="chat-head">CHART</div>
      <div id="chatList"><div class="empty">Loading users...</div></div>
    </aside>
  </main>

  <button class="settings" onclick="openSettings()">⚙ SETTING</button>
</div>

<div class="overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyARNIMr9CLKIFOt6AONAa4fYz-pe28yX4I",
  authDomain: "maja-ae9d0.firebaseapp.com",
  projectId: "maja-ae9d0",
  storageBucket: "maja-ae9d0.firebasestorage.app",
  messagingSenderId: "21674614341",
  appId: "1:21674614341:web:2f63073f1d0e1c3df04d2c"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const FieldValue = firebase.firestore.FieldValue;

let currentUser = null;   // firebase auth user
let myProfile = null;     // { username, displayName, avatar }
let usersCache = {};      // uid -> {username, displayName, avatar}
let activeChatUid = null;
let activeChatId = null;
let unsubMessages = null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

/* ---------------- AUTH GUARD ---------------- */
auth.onAuthStateChanged(async function(user){
  if(!user){
    window.location.href = 'login.html';
    return;
  }
  currentUser = user;
  const snap = await db.collection('users').doc(user.uid).get();
  myProfile = snap.exists ? snap.data() : { username: user.email.split('@')[0], displayName: user.email.split('@')[0], avatar: null };
  usersCache[user.uid] = myProfile;

  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';

  refreshTopAvatar();
  listenPosts();
  listenUsers();
});

function logout(){
  if(unsubMessages) unsubMessages();
  auth.signOut().then(()=>{ window.location.href = 'login.html'; });
}

/* ---------------- USERS / CONTACTS ---------------- */
function listenUsers(){
  db.collection('users').onSnapshot(function(qs){
    const list = [];
    qs.forEach(doc=>{
      const data = doc.data();
      usersCache[doc.id] = data;
      if(doc.id !== currentUser.uid){
        list.push(Object.assign({ uid: doc.id }, data));
      }
    });
    renderChats(list);
  });
}

function renderChats(list){
  const box = document.getElementById('chatList');
  if(!list.length){ box.innerHTML = '<div class="empty">No other users yet.</div>'; return; }
  box.innerHTML = list.map(u=>`
    <div class="chat-item" onclick="openChat('${esc(u.uid)}')">
      <div class="avatar">${u.avatar ? `<img src="${u.avatar}">` : esc((u.displayName||u.username||'?').charAt(0).toUpperCase())}</div>
      <div class="chat-text"><b>${esc(u.displayName||u.username)}</b><span>@${esc(u.username)}</span></div>
    </div>`).join('');
}

/* ---------------- POSTS / THREAD ---------------- */
function listenPosts(){
  db.collection('posts').orderBy('createdAt','desc').limit(100).onSnapshot(function(qs){
    const posts = [];
    qs.forEach(doc=> posts.push(Object.assign({ id: doc.id }, doc.data())));
    renderPosts(posts);
  }, function(err){
    document.getElementById('posts').innerHTML = '<div class="empty">Could not load posts. Check your Firestore rules / internet connection.</div>';
    console.error(err);
  });
}

function renderPosts(posts){
  const box = document.getElementById('posts');
  if(!posts.length){ box.innerHTML = '<div class="empty">No posts yet.</div>'; return; }
  box.innerHTML = posts.map(p=>{
    const liked = (p.likedBy||[]).includes(currentUser.uid);
    const mine = p.authorUid === currentUser.uid;
    const author = usersCache[p.authorUid];
    const displayName = (author && (author.displayName||author.username)) || p.authorUsername || 'User';
    const avatar = author && author.avatar;
    return `
    <article class="post" id="post-${p.id}">
      <div class="post-head">
        <div class="avatar">${avatar ? `<img src="${avatar}">` : esc(displayName.charAt(0).toUpperCase())}</div>
        <div class="user-info"><b>${esc(displayName)}</b><span>${timeAgo(p.createdAt)}</span></div>
        ${mine ? `<button class="more" onclick="deletePost('${p.id}')">⋮</button>` : ''}
      </div>
      ${p.text ? `<div class="post-body">${esc(p.text)}</div>` : ''}
      ${p.image ? `<img class="post-image" style="display:block" src="${p.image}" alt="Post picture">` : ''}
      <div class="post-meta"><span>👁 seen</span><span>${p.likes||0} likes</span><span>${p.commentCount||0} comments</span></div>
      <div class="actions">
        <button class="${liked?'liked':''}" onclick="likePost('${p.id}')">♥ LIKE</button>
        <button onclick="toggleComment('${p.id}')">💬 COMMENT</button>
        <button onclick="repost('${p.id}')">↻ REPOST</button>
      </div>
      <div class="comment-box" id="comment-${p.id}">
        <div class="comment-list" id="comment-list-${p.id}"><div class="empty" style="padding:10px">Loading...</div></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <input id="comment-input-${p.id}" style="flex:1" placeholder="Write a comment..." onkeydown="if(event.key==='Enter') addComment('${p.id}')">
          <button class="primary" onclick="addComment('${p.id}')">SEND</button>
        </div>
      </div>
    </article>`;
  }).join('');
}

function timeAgo(ts){
  if(!ts || !ts.toDate) return 'just now';
  const diff = Math.floor((Date.now() - ts.toDate().getTime())/1000);
  if(diff < 60) return 'just now';
  if(diff < 3600) return Math.floor(diff/60)+'m';
  if(diff < 86400) return Math.floor(diff/3600)+'h';
  return Math.floor(diff/86400)+'d';
}

const postBtn = document.getElementById('postBtn');
async function createPost(){
  const textEl = document.getElementById('postText');
  const text = textEl.value.trim();
  const preview = document.getElementById('preview');
  const image = (preview.dataset.image || '').trim();
  if(!text && !image){ alert('Write a message or add a picture.'); return; }

  postBtn.disabled = true;
  postBtn.textContent = 'POSTING...';
  try{
    await db.collection('posts').add({
      authorUid: currentUser.uid,
      authorUsername: myProfile.username,
      text: text,
      image: image || null,
      likes: 0,
      likedBy: [],
      commentCount: 0,
      reposts: 0,
      createdAt: FieldValue.serverTimestamp()
    });
    textEl.value = '';
    preview.src = '';
    preview.dataset.image = '';
    preview.style.display = 'none';
    document.getElementById('postImage').value = '';
  }catch(err){
    console.error(err);
    alert('Could not post. ' + (err.message||''));
  }
  postBtn.disabled = false;
  postBtn.textContent = 'POST';
}

function previewImage(e){
  const file = e.target.files[0]; if(!file) return;
  if(!file.type.startsWith('image/')){ alert('Please choose a picture file.'); return; }
  if(file.size > 700*1024){ alert('That image is too large (max ~700KB). Choose a smaller picture.'); return; }
  const r = new FileReader();
  r.onload = ()=>{
    const img = document.getElementById('preview');
    img.src = r.result;
    img.dataset.image = r.result;
    img.style.display = 'block';
  };
  r.readAsDataURL(file);
}

async function likePost(id){
  const ref = db.collection('posts').doc(id);
  const snap = await ref.get();
  if(!snap.exists) return;
  const data = snap.data();
  const likedBy = data.likedBy || [];
  const already = likedBy.includes(currentUser.uid);
  await ref.update({
    likedBy: already ? FieldValue.arrayRemove(currentUser.uid) : FieldValue.arrayUnion(currentUser.uid),
    likes: FieldValue.increment(already ? -1 : 1)
  });
}

async function repost(id){
  await db.collection('posts').doc(id).update({ reposts: FieldValue.increment(1) });
  toast('Reposted.');
}

async function deletePost(id){
  if(!confirm('Delete this post?')) return;
  await db.collection('posts').doc(id).delete();
}

const commentUnsubs = {};
function toggleComment(id){
  const el = document.getElementById('comment-'+id);
  const opening = el.style.display !== 'block';
  el.style.display = opening ? 'block' : 'none';
  if(opening){
    el.querySelector('input').focus();
    if(!commentUnsubs[id]){
      commentUnsubs[id] = db.collection('posts').doc(id).collection('comments')
        .orderBy('createdAt','asc').onSnapshot(function(qs){
          const list = document.getElementById('comment-list-'+id);
          if(!list) return;
          if(qs.empty){ list.innerHTML = '<div class="empty" style="padding:8px">No comments yet.</div>'; return; }
          list.innerHTML = '';
          qs.forEach(doc=>{
            const c = doc.data();
            const row = document.createElement('div');
            row.className = 'c';
            row.innerHTML = `<b>${esc(c.authorUsername)}</b>${esc(c.text)}`;
            list.appendChild(row);
          });
        });
    }
  }
}

async function addComment(id){
  const input = document.getElementById('comment-input-'+id);
  const val = input.value.trim();
  if(!val) return;
  input.value = '';
  const postRef = db.collection('posts').doc(id);
  await postRef.collection('comments').add({
    authorUid: currentUser.uid,
    authorUsername: myProfile.username,
    text: val,
    createdAt: FieldValue.serverTimestamp()
  });
  await postRef.update({ commentCount: FieldValue.increment(1) });
}

/* ---------------- TABS ---------------- */
function showTab(tab){
  const thread = tab === 'thread';
  document.getElementById('threadView').style.display = thread ? 'block' : 'none';
  document.getElementById('chartView').style.display = thread ? 'none' : 'block';
  document.getElementById('threadBtn').classList.toggle('active', thread);
  document.getElementById('chartBtn').classList.toggle('active', !thread);
}

/* ---------------- CHAT ---------------- */
function chatIdFor(uidA, uidB){
  return [uidA, uidB].sort().join('_');
}

function openChat(otherUid){
  activeChatUid = otherUid;
  activeChatId = chatIdFor(currentUser.uid, otherUid);
  const other = usersCache[otherUid] || {};
  const overlay = document.getElementById('modalOverlay'), box = document.getElementById('modalContent');
  overlay.style.display = 'flex';
  box.className = 'modal chat-window';
  box.innerHTML = `
    <div style="padding-bottom:10px;border-bottom:1px solid var(--line)">
      <button class="close" onclick="closeAll()">×</button><b style="font-size:19px">${esc(other.displayName||other.username||'User')}</b>
    </div>
    <div class="messages" id="messages"><div class="empty">Loading...</div></div>
    <div class="chat-input">
      <input id="chatInput" placeholder="Write message..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="primary" onclick="sendMessage()">SEND</button>
    </div>`;

  if(unsubMessages) unsubMessages();
  unsubMessages = db.collection('chats').doc(activeChatId).collection('messages')
    .orderBy('createdAt','asc').onSnapshot(function(qs){
      const wrap = document.getElementById('messages');
      if(!wrap) return;
      if(qs.empty){ wrap.innerHTML = '<div class="empty">Start the conversation 👋</div>'; return; }
      wrap.innerHTML = '';
      qs.forEach(doc=>{
        const m = doc.data();
        const div = document.createElement('div');
        div.className = 'msg ' + (m.from === currentUser.uid ? 'me' : 'other');
        div.textContent = m.text;
        wrap.appendChild(div);
      });
      wrap.scrollTop = wrap.scrollHeight;
    });
}

async function sendMessage(){
  const input = document.getElementById('chatInput');
  const val = input.value.trim();
  if(!val || !activeChatId) return;
  input.value = '';
  const chatRef = db.collection('chats').doc(activeChatId);
  await chatRef.set({
    members: [currentUser.uid, activeChatUid],
    lastMessage: val,
    updatedAt: FieldValue.serverTimestamp()
  }, { merge: true });
  await chatRef.collection('messages').add({
    from: currentUser.uid,
    text: val,
    createdAt: FieldValue.serverTimestamp()
  });
}

/* ---------------- PROFILE ---------------- */
function getInitial(){
  const n = (myProfile && (myProfile.displayName||myProfile.username)) || '?';
  return n.charAt(0).toUpperCase();
}
function refreshTopAvatar(){
  const el = document.getElementById('topAvatar');
  if(!el) return;
  if(myProfile && myProfile.avatar) el.innerHTML = `<img src="${myProfile.avatar}">`;
  else el.textContent = getInitial();
}

function openProfile(){
  const avatar = myProfile && myProfile.avatar;
  openSimple(`
    <button class="close" onclick="closeAll()">×</button>
    <h2>MAJA PROFILE</h2>
    <div style="text-align:center">
      <div id="profileAvatar" class="avatar" style="width:90px;height:90px;margin:auto;font-size:35px">
        ${avatar ? `<img src="${avatar}">` : esc(getInitial())}
      </div>
      <br>
      <label class="file-label">
        📷 Change picture
        <input type="file" accept="image/*" onchange="changeProfilePicture(event)">
      </label>
    </div>
    <label style="display:block;margin-top:18px;font-weight:700">Display name</label>
    <input id="displayNameInput" value="${esc(myProfile.displayName||myProfile.username)}" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;margin-top:7px;outline:0">
    <label style="display:block;margin-top:14px;font-weight:700">Username</label>
    <input value="@${esc(myProfile.username)}" disabled style="width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;margin-top:7px;outline:0;background:#f5f7fb;color:var(--muted)">
    <button class="primary" style="width:100%;margin-top:14px" onclick="saveProfile()">SAVE PROFILE</button>
  `);
}

function changeProfilePicture(e){
  const file = e.target.files[0]; if(!file) return;
  if(file.size > 700*1024){ alert('That image is too large (max ~700KB).'); return; }
  const r = new FileReader();
  r.onload = ()=>{
    const a = document.getElementById('profileAvatar');
    if(a) a.innerHTML = `<img src="${r.result}">`;
    a.dataset.pending = r.result;
  };
  r.readAsDataURL(file);
}

async function saveProfile(){
  const input = document.getElementById('displayNameInput');
  const name = (input.value||'').trim();
  if(!name){ alert('Enter a name.'); return; }
  const pendingAvatar = document.getElementById('profileAvatar').dataset.pending;
  const update = { displayName: name };
  if(pendingAvatar) update.avatar = pendingAvatar;
  await db.collection('users').doc(currentUser.uid).update(update);
  myProfile = Object.assign({}, myProfile, update);
  usersCache[currentUser.uid] = myProfile;
  refreshTopAvatar();
  closeAll();
  toast('Profile saved.');
}

/* ---------------- NOTIFICATIONS (simple, local) ---------------- */
function showNotifications(){
  document.getElementById('notifyDot').style.display = 'none';
  openSimple('<button class="close" onclick="closeAll()">×</button><h2>NOTIFICATION</h2><p>❤️ Someone liked your post.</p><p>💬 You have a new comment.</p><p>↻ Your post was reposted.</p>');
}

/* ---------------- SETTINGS ---------------- */
function openSettings(){
  const darkOn = document.body.classList.contains('dark');
  openSimple(`<button class="close" onclick="closeAll()">×</button><h2>SETTING</h2>
  <div class="setting-row"><span>Dark mode</span><button class="switch ${darkOn?'on':''}" onclick="toggleDark(this)"></button></div>
  <div class="setting-row"><span>Logged in as</span><b>@${esc(myProfile.username)}</b></div>
  <button class="primary" style="width:100%;margin-top:16px" onclick="logout()">LOG OUT</button>`);
}
function toggleDark(btn){
  btn.classList.toggle('on');
  document.body.classList.toggle('dark');
  localStorage.setItem('maja_dark', document.body.classList.contains('dark') ? '1' : '0');
}
if(localStorage.getItem('maja_dark') === '1') document.body.classList.add('dark');

/* ---------------- MODAL HELPERS ---------------- */
function openSimple(html){
  const o = document.getElementById('modalOverlay'), b = document.getElementById('modalContent');
  o.style.display = 'flex'; b.className = 'modal'; b.innerHTML = html;
}
function closeAll(){
  document.getElementById('modalOverlay').style.display = 'none';
  if(unsubMessages){ unsubMessages(); unsubMessages = null; }
}
function closeModal(e){ if(e.target.id === 'modalOverlay') closeAll(); }

function toast(msg){
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 18px;border-radius:20px;font-size:13.5px;z-index:200';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}
</script>
